apply plugin: 'com.android.application'

android {
    namespace 'com.example.rfidwriter'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.rfidwriter"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // iData UHF SDK 不以 aar/jar 形式提供，改为把真机预装 UHF Demo（/system/app/iUHF/iUHF.apk）
    // 的 classes.dex 作为 app/src/main/assets/uhf_sdk.dex 打入 APK；运行时由 IdataUhfAdapter
    // 通过 DexClassLoader 加载真实的 com.idata.UHFManager 并反射调用。无需任何 compileOnly/implementation。
}
